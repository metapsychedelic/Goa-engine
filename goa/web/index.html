<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Motor Goa">
<title>Motor Goa</title>
<style>
:root{--bg:#111210;--card:#1A1C19;--line:#2A2C28;--line2:#3A3C37;--txt:#ECEDE8;--mut:#A3A59D;--acc:#D9A55B;--accbg:#2A2418;--bad:#E2836F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px;font-weight:650}
h2{margin:0;font-size:17px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.estado{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.estado div{display:flex;flex-direction:column}
.estado b{font-size:22px;font-weight:650}
.pill{font-size:12px;font-weight:650;padding:4px 10px;border-radius:10px;background:var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{background:var(--acc);color:#111210}
.pill.mal{background:#3A1E19;color:var(--bad)}
label.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C9CBC3}
select,input[type=text],input[type=number]{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);padding:0 12px;font:inherit;width:100%}
input[type=range]{width:100%;accent-color:var(--acc);min-height:28px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.seg{display:grid;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:4px;cursor:pointer}
.seg input:checked+label{border-color:var(--acc);background:var(--accbg);font-weight:650}
.seg input:focus-visible+label{outline:2px solid var(--acc);outline-offset:2px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{min-height:44px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--txt);font:inherit;font-weight:550;padding:0 14px;cursor:pointer}
button.prim{background:var(--acc);border-color:var(--acc);color:#111210}
button.panico{min-height:52px;border-color:#8C3B32;background:#2A1714;color:#F2B8AF;font-weight:650;width:100%}
.seed{display:flex;gap:6px}
.seed input{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-weight:650;letter-spacing:.05em}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
.grilla{display:flex;flex-direction:column;gap:12px}
.fila-clips{display:flex;flex-wrap:wrap;gap:8px}
.clip{min-height:52px;min-width:96px;flex:1 1 96px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-weight:600;padding:6px 10px;text-align:center}
.clip.sonando{background:var(--acc);border-color:var(--acc);color:#111210}
.clip.cola{border:2px dashed var(--acc);color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.clip.cola{animation:titila 1s steps(2) infinite}}
@keyframes titila{50%{opacity:.45}}
.clip.parar{flex:0 0 auto;min-width:72px;color:var(--mut)}
details.voz{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.voz>summary{cursor:pointer;font-weight:650;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none}
details.voz>summary::-webkit-details-marker{display:none}
details.voz>*:not(summary){margin-top:12px}
.guardado{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.guardado.ver{opacity:1}
.guardado.error{color:var(--bad);border-color:#8C3B32}
</style>
</head>
<body>
<main>
  <div class="fila">
    <h1>Motor Goa</h1>
    <span class="pill" id="pill">Conectando…</span>
  </div>

  <section class="card" aria-label="Estado">
    <div class="estado">
      <div><span class="mut">Tempo</span><b id="bpm">–</b><span class="mut">reloj Circuit</span></div>
      <div><span class="mut">Nota</span><b id="raiz">–</b><span class="mut">disparadora</span></div>
      <div><span class="mut">Compás</span><b id="compas">–</b><span class="mut" id="ver">&nbsp;</span></div>
    </div>
    <div class="mut" id="acorde"></div>
    <div class="mut" id="puertos"></div>
  </section>

  <section class="card" aria-label="Proyecto">
    <div class="fila"><h2 id="proyecto_nombre">Sin proyecto</h2><button id="proyecto_abrir">Abrir</button></div>
    <div class="dos"><button id="proyecto_guardar" class="prim">Guardar</button><button id="proyecto_guardar_como">Guardar como…</button></div>
    <div id="proyecto_lista" style="display:none;flex-direction:column;gap:6px"></div>
  </section>

  <button class="panico" id="panico">Pánico · apagar todas las notas</button>

  <section class="card">
    <div class="fila"><h2>Disparador</h2><label class="mut" style="display:flex;align-items:center;gap:6px;min-height:44px"><input type="checkbox" id="editar_clips">Borrar clips</label></div>
    <p class="mut" style="margin:0">Toca un clip para que entre en el próximo compás de la Circuit. Guarda clips desde cada secuencia y desde Llamada y respuesta.</p>
    <div class="grilla" id="grilla"></div>
  </section>

  <section class="card">
    <h2>Música</h2>
    <div class="dos">
      <label class="campo">Tónica <select data-k="musica.tonica" id="tonica"></select></label>
      <label class="campo">Escala <select data-k="musica.escala" id="escala"></select></label>
    </div>
    <div class="campo" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C9CBC3">Cambio de nota
      <div class="seg" style="grid-template-columns:1fr 1fr" id="cambio"></div></div>
    <div class="campo" style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C9CBC3">Adaptación
      <div class="seg" style="grid-template-columns:1fr 1fr" id="adaptacion"></div></div>
    <label class="campo">Canal general de la nota larga (lo usan las secuencias y pads en 0)
      <input type="number" min="1" max="16" data-k="entrada.canal_disparo" id="canal_disparo"></label>
    <label class="campo">Soltar la nota si no se repite en (compases, 0 = nunca)
      <input type="number" min="0" max="64" id="nota_maxima"></label>
    <label class="fila" style="min-height:44px"><span>Las secuencias siguen al acorde<br><span class="mut">La nota base sale del acorde de los pads</span></span>
      <input type="checkbox" id="seguir_pads"></label>
  </section>

  <section class="card" id="pads"></section>

  <section class="card" id="dialogo"></section>

  <section class="card">
    <h2>Conexión MIDI</h2>
    <label class="campo">Entrada (puerto de la Circuit o del dongle)
      <input type="text" list="salidas" id="entrada_puerto"></label>
    <label class="fila" style="min-height:44px"><span>Reenviar todo a la cadena MIDI<br><span class="mut">Modo dongle: la Circuit pasa por la Pi</span></span>
      <input type="checkbox" id="thru_activo"></label>
    <label class="campo">Salida del reenvío
      <input type="text" list="salidas" id="thru_salida"></label>
  </section>

  <div class="fila"><h2>Secuencias</h2><button id="agregar">+ Añadir</button></div>
  <div id="secuencias" style="display:flex;flex-direction:column;gap:12px"></div>
  <datalist id="salidas"></datalist>
</main>
<div class="guardado" id="aviso" role="status" aria-live="polite"></div>

<script>
const TONICAS = [["C","C · Do"],["C#","C# · Do#"],["D","D · Re"],["D#","D# · Re#"],["E","E · Mi"],["F","F · Fa"],["F#","F# · Fa#"],["G","G · Sol"],["G#","G# · Sol#"],["A","A · La"],["A#","A# · La#"],["B","B · Si"]];
const PROGRESIONES = [["i_bII","i – ♭II · frigio oscuro"],["i_bVI_bVII","i – ♭VI – ♭VII · épica, para clímax"],["i_v","i – v · con menor armónica suena V, oriental"],["drone_modal","Drone modal · la raíz fija, acordes encima"],["i_iv_bII_i","i – iv – ♭II – i · ciclo largo para breaks"],["andaluza","i – ♭VII – ♭VI – V · bajada andaluza"]];
const ACORDES = [["quintas","Quintas abiertas"],["sus2","Sus2"],["menor_add9","Menor add9 (de la escala)"],["triada","Tríada"],["cluster","Cluster suave"]];
const ESCALAS = [["frigio","Frigio"],["menor_armonica","Menor armónica"],["frigio_dominante","Frigio dominante"],["menor","Menor natural"],["hungara_menor","Húngara menor"]];
const ESTILOS = [["rolling","Rolling"],["galope","Galope"],["arpegio3","Arpegio 3"],["acido","Ácido 303"]];
const POSICIONES = [["onbeat","On beat"],["offbeat","Offbeat"],["todos","Todos"],["desplazado","Desplazado"]];
const RELACIONES = [["unisono","Unísono"],["tercera","Tercera"],["quinta","Quinta"],["octava","Octava"]];
const TRANSFORMACIONES = [["variacion","Variación"],["espejo","Espejo"],["eco","Eco"],["nueva","Nueva"]];
const TRANSF_TEXTO = {variacion: "Contesta con otras notas. El parecido decide cuánto: alto calca ritmo y dirección, bajo usa su propia figura y responde al revés.",
  espejo: "La frase invertida: donde la llamada sube, la respuesta baja.",
  eco: "Repite la llamada con el carácter de la respuesta (escala, relación, octava). Con evolución, cambia de a poco.",
  nueva: "Una frase propia, hecha solo con el carácter de la respuesta."};
const CONTORNOS = [["libre","Libre"],["sube","Sube"],["baja","Baja"],["arco","Arco"],["valle","Valle"]];
const RITMOS = [["semicorcheas","Semicorcheas"],["corcheas","Corcheas"],["mixto","Mixto"],["largas","Largas"]];
const FINALES = [["suspendido","Suspendido (quinta, abierto)"],["tension","Tensión (♭2, ♭7: pregunta)"],["reposo","Reposo (resuelve)"],["libre","Libre"]];
const MOVIMIENTOS = [["conjunto","Conjunto"],["abierto","Abierto"],["arpegio","Arpegio"]];
const MOV_TEXTO = {conjunto: "Por grados vecinos: más cantado, más tenso en frigio.",
  abierto: "Cuartas, quintas y octavas con algún paso: espacial, galáctico.",
  arpegio: "Notas del acorde menor con séptima: misterioso y estable."};
const RELACIONES_CR = [["unisono","Unísono"],["tercera","Tercera"],["cuarta","Cuarta"],["quinta","Quinta"],["sexta","Sexta"],["octava","Octava"]];
const FASES = {llamada: "Llamando", respuesta: "Respondiendo", espacio: "Espacio", escuchando: "Escuchándote"};
let cfg = null, temporizador = null, uid = 0;
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, hijos = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== "list") e[k] = v; else e.setAttribute(k, v);
  }
  for (const h of [].concat(hijos)) if (h != null) e.append(h);
  return e;
}

function aviso(texto, error = false) {
  const a = $("aviso");
  a.textContent = texto;
  a.className = "guardado ver" + (error ? " error" : "");
  clearTimeout(a._t);
  a._t = setTimeout(() => a.className = "guardado" + (error ? " error" : ""), error ? 4000 : 1200);
}

function guardar() {
  clearTimeout(temporizador);
  temporizador = setTimeout(async () => {
    try {
      const r = await fetch("/api/config", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cfg)});
      const d = await r.json();
      if (!r.ok) aviso(d.error || "No se pudo aplicar", true);
      else aviso(d.aviso || "Aplicado", !!d.aviso);
    } catch (e) { aviso("Sin conexión con la Pi", true); }
  }, 350);
}

function segmentado(opciones, valor, alCambiar, columnas) {
  const nombre = "s" + (uid++);
  const cont = el("div", {className: "seg", style: `grid-template-columns:repeat(${columnas},minmax(0,1fr))`});
  for (const [v, texto] of opciones) {
    const id = nombre + v;
    cont.append(el("input", {type: "radio", name: nombre, id, value: v, checked: v === valor, onchange: () => alCambiar(v)}),
                el("label", {htmlFor: id, textContent: texto}));
  }
  return cont;
}

function campo(texto, control) {
  return el("div", {style: "display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C9CBC3"}, [texto, control]);
}

function deslizador(s, k, texto, min, max, paso, formato) {
  const valor = el("span", {textContent: formato(s[k])});
  const r = el("input", {type: "range", min, max, step: paso, value: s[k], "aria-label": texto,
    oninput: () => { s[k] = parseFloat(r.value); valor.textContent = formato(s[k]); guardar(); }});
  return el("label", {className: "campo"}, [el("span", {}, [texto + " · ", valor]), r]);
}

function colorTexto(x) {
  const nombre = x < 0.15 ? "luminoso" : x < 0.5 ? "claro" : x < 0.85 ? "oscuro" : "ultra oscuro";
  return `${nombre} (${Math.round(x * 100)} %)`;
}

function seedNueva() {
  const hex = () => Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, "0");
  return hex() + "-" + hex();
}

function tarjeta(s, i) {
  const titulo = el("span", {style: "font-weight:650", textContent: `${s.nombre} · ${s.salida}`});
  const estado = el("span", {className: "pill", "data-salida": s.salida});
  const activa = el("input", {type: "checkbox", checked: s.activa, onchange: () => { s.activa = activa.checked; guardar(); }});
  const actualizarTitulo = () => { titulo.textContent = `${s.nombre} · ${s.salida}`; estado.dataset.salida = s.salida; };

  const texto = (k, etiqueta, extra = {}) => {
    const inp = el("input", Object.assign({type: "text", value: s[k],
      onchange: () => { s[k] = inp.value.trim() || s[k]; inp.value = s[k]; actualizarTitulo(); guardar(); }}, extra));
    return el("label", {className: "campo"}, [etiqueta, inp]);
  };
  const numero = (k, etiqueta, min, max) => {
    const inp = el("input", {type: "number", min, max, value: s[k],
      onchange: () => { s[k] = Math.max(min, Math.min(max, parseInt(inp.value) || s[k])); inp.value = s[k]; guardar(); }});
    return el("label", {className: "campo"}, [etiqueta, inp]);
  };

  const seed = el("input", {type: "text", value: s.seed, "aria-label": "Seed",
    onchange: () => { s.seed = seed.value.trim() || s.seed; seed.value = s.seed; guardar(); }});
  const candado = el("input", {type: "checkbox", checked: s.bloqueada, onchange: () => { s.bloqueada = candado.checked; guardar(); }});

  const cuerpo = [
    el("label", {className: "fila", style: "min-height:44px"}, [el("span", {style: "font-weight:550", textContent: "Activa"}), activa]),
    el("div", {className: "dos"}, [texto("nombre", "Nombre", {maxLength: 12}), texto("salida", "Destino (puerto)", {list: "salidas"})]),
    el("div", {className: "dos"}, [numero("canal", "Canal MIDI", 1, 16), numero("octava", "Octava", -3, 3)]),
    numero("disparo", "Canal de su nota larga en la Circuit (0 = el general)", 0, 16),
    campo("Estilo", segmentado(ESTILOS, s.estilo, (v) => {
      s.estilo = v;
      if (v === "acido" && !s.slide && !s.acentos) { s.slide = 0.3; s.acentos = 0.3; s.largas = s.largas || 0.3; render(); }
      guardar();
    }, 2)),
    campo("Posición rítmica", segmentado(POSICIONES, s.posicion, (v) => { s.posicion = v; guardar(); }, 2)),
    campo("Relación con la nota", segmentado(RELACIONES, s.relacion, (v) => { s.relacion = v; guardar(); }, 4)),
    campo("Largo del patrón", segmentado([[16,"16"],[13,"13"],[11,"11"],[7,"7"]].map(([v,t]) => [String(v), t]), String(s.largo), (v) => { s.largo = parseInt(v); guardar(); }, 4)),
    deslizador(s, "gate", "Gate", 0.05, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "pedal", "Pedal (vuelve a la raíz)", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    campo("Seed", el("div", {className: "seed"}, [seed,
      el("button", {type: "button", textContent: "Otra", onclick: () => { s.seed = seedNueva(); seed.value = s.seed; guardar(); }})])),
    el("label", {className: "fila", style: "min-height:44px"}, [el("span", {}, ["Bloquear patrón", el("br"), el("span", {className: "mut", textContent: "La mutación no lo cambia"})]), candado]),
    deslizador(s, "mutacion", "Mutación", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    numero("mutar_cada", "Mutar cada (compases)", 1, 64),
    el("h3", {style: "margin:6px 0 0;font-size:15px", textContent: "Afinar"}),
    deslizador(s, "densidad", "Densidad de notas", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "gate_random", "Gate aleatorio", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "vel_random", "Velocidad aleatoria", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "swing", "Swing", 0, 0.5, 0.05, (v) => Math.round(v * 200) + " %"),
    deslizador(s, "slide", "Slides", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "acentos", "Acentos", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "saltos", "Saltos de octava", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "repeticion", "Repeticiones (redobles de fusa)", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    deslizador(s, "largas", "Notas largas (se sostienen sobre los silencios)", 0, 1, 0.05, (v) => Math.round(v * 100) + " %"),
    el("p", {className: "mut", style: "margin:0", textContent: "En Ácido 303, Acentos y Slides son la cantidad total; en los demás estilos se suman a los del estilo. Para que los slides deslicen, pon el sinte en modo mono o legato con glide."}),
    el("div", {className: "dos"}, [numero("velocidad", "Velocidad", 1, 127), numero("acento", "Acento", 1, 127)]),
    el("button", {type: "button", textContent: "Guardar como clip", className: "prim",
      onclick: () => guardarClip(i, s)}),
    el("button", {type: "button", textContent: "Eliminar secuencia", style: "color:var(--bad);border-color:#5A2A24",
      onclick: () => { if (confirm(`¿Eliminar la secuencia ${s.nombre}?`)) { cfg.secuencia.splice(i, 1); render(); guardar(); } }}),
  ];
  return el("details", {className: "card", open: i === 0}, [
    el("summary", {}, [el("span", {style: "display:flex;flex-direction:column;gap:2px"}, [titulo, el("span", {className: "mut", textContent: `canal ${s.canal} · ${s.estilo} · ${s.posicion}`})]),
      estado]),
    ...cuerpo,
  ]);
}

function render() {
  const sel = (id, opciones, valor, alCambiar) => {
    const s = $(id); s.innerHTML = "";
    for (const [v, t] of opciones) s.append(el("option", {value: v, textContent: t, selected: v === valor}));
    s.onchange = () => { alCambiar(s.value); guardar(); };
  };
  const ES = {DO: "C", RE: "D", MI: "E", FA: "F", SOL: "G", LA: "A", SI: "B"};
  let ton = cfg.musica.tonica.toUpperCase().replace(/^(DO|RE|MI|FA|SOL|LA|SI)/, (m) => ES[m]);
  sel("tonica", TONICAS, ton, (v) => cfg.musica.tonica = v);
  sel("escala", ESCALAS, cfg.musica.escala, (v) => cfg.musica.escala = v);
  $("cambio").replaceWith(Object.assign(segmentado([["paso","Siguiente paso"],["compas","Siguiente compás"]], cfg.musica.cambio_de_nota, (v) => { cfg.musica.cambio_de_nota = v; guardar(); }, 2), {id: "cambio"}));
  $("adaptacion").replaceWith(Object.assign(segmentado([["escala","Ajustar a la escala"],["transponer","Transponer igual"]], cfg.musica.adaptacion, (v) => { cfg.musica.adaptacion = v; guardar(); }, 2), {id: "adaptacion"}));
  const cd = $("canal_disparo"); cd.value = cfg.entrada.canal_disparo;
  cd.onchange = () => { cfg.entrada.canal_disparo = Math.max(1, Math.min(16, parseInt(cd.value) || 4)); cd.value = cfg.entrada.canal_disparo; guardar(); };
  const nm = $("nota_maxima"); nm.value = cfg.entrada.nota_maxima;
  nm.onchange = () => { const v = parseInt(nm.value); cfg.entrada.nota_maxima = isNaN(v) ? 4 : Math.max(0, Math.min(64, v)); nm.value = cfg.entrada.nota_maxima; guardar(); };
  const sp = $("seguir_pads"); sp.checked = cfg.musica.seguir_pads;
  sp.onchange = () => { cfg.musica.seguir_pads = sp.checked; guardar(); };

function colorGeneral() {
  // Mueve la oscuridad de las dos voces juntas; cada voz tiene además su propio control.
  const vivo = cfg.dialogo.modo === "en_vivo";
  const voces = vivo ? [cfg.respuesta] : [cfg.llamada, cfg.respuesta];
  const general = {v: voces.reduce((a, x) => a + x.oscuridad, 0) / voces.length};
  const control = deslizador(general, "v", "Luminoso ↔ Oscuro (ambas voces)", 0, 1, 0.05, colorTexto);
  const r = control.querySelector("input");
  r.addEventListener("input", () => { for (const x of voces) x.oscuridad = general.v; });
  r.addEventListener("change", () => renderDialogo());
  return control;
}

let ultimoEstado = null;

async function api(ruta, datos) {
  const r = await fetch(ruta, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(datos || {})});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "No se pudo");
  return d;
}

async function recargar() {
  cfg = await (await fetch("/api/config")).json();
  render();
}

async function guardarClip(i, s) {
  const nombre = prompt("Nombre del clip", `${s.estilo} ${s.seed}`);
  if (nombre === null) return;
  try { await api("/api/clip/guardar", {fila: i, nombre}); await recargar(); aviso("Clip guardado"); }
  catch (e) { aviso(e.message, true); }
}

async function guardarClipDialogo() {
  const d = cfg.dialogo;
  const nombre = prompt("Nombre del clip de diálogo", `${d.modo === "en_vivo" ? "Vivo" : "Motor"} ${d.transformacion} ${d.seed}`);
  if (nombre === null) return;
  try {
    clearTimeout(temporizador);  // aplica primero lo último que cambiaste, para que el clip lo incluya
    await api("/api/config", cfg);
    await api("/api/dialogo/clip/guardar", {nombre}); await recargar(); aviso("Clip de diálogo guardado");
  } catch (e) { aviso(e.message, true); }
}

function renderGrilla() {
  const g = $("grilla"); g.innerHTML = "";
  const borrar = $("editar_clips").checked;
  const dialogos = cfg.clip_dialogo || [];
  if (!cfg.clip.length && !dialogos.length) { g.append(el("p", {className: "mut", style: "margin:0", textContent: "Todavía no hay clips."})); return; }
  if (borrar) {
    const fila = el("div", {className: "fila-clips"});
    const boton = (c, ci, ruta, tipo) => el("button", {className: "clip", textContent: "Borrar " + c.nombre, style: "color:var(--bad)",
      onclick: async () => { if (!confirm(`¿Borrar el ${tipo} ${c.nombre}?`)) return;
        try { await api(ruta, {indice: ci}); await recargar(); } catch (e) { aviso(e.message, true); } }});
    cfg.clip.forEach((c, ci) => fila.append(boton(c, ci, "/api/clip/borrar", "clip")));
    dialogos.forEach((c, ci) => fila.append(boton(c, ci, "/api/dialogo/clip/borrar", "clip de diálogo")));
    g.append(fila); return;
  }
  if (dialogos.length) {
    const fila = el("div", {className: "fila-clips", "data-fila-dialogo": "1"});
    dialogos.forEach((c, ci) => fila.append(el("button", {className: "clip", textContent: c.nombre, "data-clip": c.nombre,
      onclick: async () => { try { await api("/api/dialogo/lanzar", {clip: ci}); await recargar(); estado(); } catch (e) { aviso(e.message, true); } }})));
    fila.append(el("button", {className: "clip parar", textContent: "■ Parar", "data-parar": "1",
      onclick: async () => { try { await api("/api/dialogo/detener", {}); await recargar(); estado(); } catch (e) { aviso(e.message, true); } }}));
    g.append(el("div", {style: "display:flex;flex-direction:column;gap:6px"}, [
      el("span", {className: "mut", textContent: "Llamada y respuesta"}), fila]));
  }
  if (!cfg.clip.length) { pintarGrilla(); return; }
  cfg.secuencia.forEach((s, fi) => {
    const fila = el("div", {className: "fila-clips", "data-fila": fi});
    cfg.clip.forEach((c, ci) => fila.append(el("button", {className: "clip", textContent: c.nombre, "data-clip": c.nombre,
      onclick: async () => { try { await api("/api/lanzar", {fila: fi, clip: ci}); estado(); } catch (e) { aviso(e.message, true); } }})));
    fila.append(el("button", {className: "clip parar", textContent: "■ Parar", "data-parar": "1",
      onclick: async () => { try { await api("/api/detener", {fila: fi}); estado(); } catch (e) { aviso(e.message, true); } }}));
    g.append(el("div", {style: "display:flex;flex-direction:column;gap:6px"}, [
      el("span", {className: "mut", textContent: `${s.nombre} · ${s.salida} canal ${s.canal}`}), fila]));
  });
  pintarGrilla();
}

function pintarFila(fila, f) {
  fila.querySelectorAll("[data-clip]").forEach((b) => {
    const n = b.dataset.clip;
    b.classList.toggle("cola", f.cola === n);
    b.classList.toggle("sonando", f.activa && f.clip === n && f.cola !== n);
  });
  fila.querySelector("[data-parar]").classList.toggle("cola", f.cola === "detener");
}

function pintarGrilla() {
  if (!ultimoEstado || !ultimoEstado.filas) return;
  const fd = document.querySelector("#grilla [data-fila-dialogo]");
  if (fd && ultimoEstado.fila_dialogo) pintarFila(fd, ultimoEstado.fila_dialogo);
  document.querySelectorAll("#grilla [data-fila]").forEach((fila) => {
    const f = ultimoEstado.filas[parseInt(fila.dataset.fila)];
    if (!f) return;
    fila.querySelectorAll("[data-clip]").forEach((b) => {
      const n = b.dataset.clip;
      b.classList.toggle("cola", f.cola === n);
      b.classList.toggle("sonando", f.activa && f.clip === n && f.cola !== n);
    });
    const parar = fila.querySelector("[data-parar]");
    parar.classList.toggle("cola", f.cola === "detener");
  });
}

async function estado() {
  try {
    const d = await (await fetch("/api/estado")).json();
    const p = $("pill");
    if (!d.entrada) { p.textContent = "Sin Circuit"; p.className = "pill mal"; }
    else if (d.corriendo) { p.textContent = "Sonando"; p.className = "pill ok"; }
    else { p.textContent = "Detenido"; p.className = "pill"; }
    $("bpm").textContent = d.bpm ? Math.round(d.bpm) : "–";
    $("raiz").textContent = d.raiz || "–";
    $("compas").textContent = d.compas || "–";
    $("ver").textContent = "v" + d.version;
    $("acorde").textContent = d.acorde ? "Pads: " + d.acorde : "";
    const fase = $("dialogo_fase");
    if (fase) { fase.textContent = FASES[d.dialogo] || "En silencio"; fase.className = "pill" + (d.dialogo && d.dialogo !== "espacio" ? " ok" : ""); }
    ultimoEstado = d; pintarGrilla();
    const faltan = Object.entries(d.salidas).filter(([, ok]) => !ok).map(([k]) => k);
    $("puertos").textContent = faltan.length ? "Sin conexión: " + faltan.join(", ") : "Todas las salidas conectadas";
    document.querySelectorAll("[data-salida]").forEach((e) => {
      const ok = d.salidas[e.dataset.salida];
      e.textContent = ok ? "Conectada" : "Sin cable"; e.className = "pill" + (ok ? " ok" : " mal");
    });
    const dl = $("salidas"); dl.innerHTML = "";
    for (const n of d.disponibles) dl.append(el("option", {value: n}));
  } catch (e) {
    $("pill").textContent = "Sin conexión"; $("pill").className = "pill mal";
  }
}

$("panico").onclick = async () => {
  try { await fetch("/api/panico", {method: "POST"}); aviso("Notas apagadas"); } catch (e) { aviso("Sin conexión con la Pi", true); }
};
$("agregar").onclick = () => {
  const base = cfg.secuencia[cfg.secuencia.length - 1] || {salida: "FM-1", canal: 2, estilo: "rolling", posicion: "offbeat", relacion: "unisono",
    octava: 0, largo: 16, gate: 0.55, pedal: 0.5, mutacion: 0, mutar_cada: 8, bloqueada: false, velocidad: 96, acento: 124};
  const letra = String.fromCharCode(65 + cfg.secuencia.length);
  cfg.secuencia.push(Object.assign({}, base, {nombre: letra, seed: seedNueva(), activa: true}));
  render(); guardar();
};

(async () => {
  try { cfg = await (await fetch("/api/config")).json(); render(); }
  catch (e) { aviso("No pude cargar la configuración", true); }
  estado(); setInterval(estado, 1000);
})();
</script>
</body>
</html>
