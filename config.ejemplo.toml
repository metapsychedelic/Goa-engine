# Configuración del motor Goa · etapa 1
# Lo más cómodo es cambiarla desde la app: http://goa.local:8080
# Si la editas a mano, después corre: goa-restart

[app]
puerto = 8080             # la app queda en http://goa.local:8080

[entrada]
# Parte del nombre del puerto USB de la Circuit (míralo con goa-ports)
puerto = "Circuit"
# Canal de la pista de la Circuit donde mantienes la nota larga
canal_disparo = 2        # pista Synth 2 de la Circuit, con volumen en cero
# Si una nota no se repite en tantos compases, se da por soltada (0 = nunca)
nota_maxima = 4

[thru]
# Modo dongle (recomendado: sin ruido y sin que la Pi se caiga).
# Cables: Circuit MIDI Out -> IN del dongle · OUT del dongle -> MicroFreak In -> Thru -> FM-1.
# La Pi reenvía todo lo de la Circuit y le suma sus secuencias.
# Para usarlo: activo = true, entrada.puerto y las salidas de las secuencias
# con el nombre del dongle (míralo con goa-ports).
activo = false
salida = "USB MIDI"

[musica]
tonica = "F"              # C, D, E, F, G, A, B (también Fa, Sol, Sib, F#...)
escala = "frigio"         # frigio, menor_armonica, frigio_dominante, menor, hungara_menor, dorico, lidio
cambio_de_nota = "paso"   # "paso": cambia al siguiente paso · "compas": espera al siguiente compás
adaptacion = "escala"     # "escala": se ajusta a la tonalidad · "transponer": mueve el patrón igual
seguir_pads = false       # true: las secuencias toman como base la raíz del acorde de los pads
# Género para todo: en la app pone la escala y este género en todos los motores.
# Cada motor (pads, llamada y respuesta, cada secuencia) tiene además su propio género.
genero = "goa"            # goa, psy_chill, chillgressive, chillout, ambient
# Pegado ↔ Desplazado: 0 = todo justo en la rejilla · 1 = notas corridas a semicorcheas débiles, swing y humano.
# Mueve la llamada, la respuesta y el pulso de los pads; las secuencias (el bajo) nunca se corren.
desplazamiento = 0.0
# Armonía: guiada = los pads guían (las secuencias y el diálogo saben qué acorde suena y cuál viene);
# libre = cada motor cuenta sus notas desde su raíz, sin mirar el acorde. Cada motor puede tener la suya.
armonia = "guiada"        # guiada, libre
tension = 0.3             # secuencias: cuántas notas fuera del acorde quedan en los tiempos débiles (0 = ninguna)
anticipar = true          # la última nota antes de un cambio de acorde lleva al acorde que viene

[pads]
activo = false
salida = "CH345"          # parte del nombre del puerto
canal = 3                 # 3 = MicroFreak (4 voces) · 4 = FM-1
base = "nota"             # "nota": la progresión parte de la nota larga · "tonica": de la tónica
progresion = "i_bII"      # i_bII, i_bVI_bVII, i_v, drone_modal, i_iv_bII_i, andaluza,
                          # i_IV, i_IV_i_bVII, i_bVI_bVII_v, i_bVI_iv_v, pedal_I_II
acorde = "menor_add9"     # quintas, sus2, menor_add9, triada, cluster, septima, novena
cambia_cada = 16          # compases por acorde
voces = 4                 # 2 a 6 (la MicroFreak toca hasta 4)
octava = 0
apertura = "abierta"      # cerrada, abierta, amplia
variacion = 0.15          # probabilidad de cambiar un acorde por uno emparentado
ataque = "ligado"         # ligado: mantiene las notas en común · reatacar: vuelve a tocar todo
drone = false             # nota grave sostenida en la raíz
rasgueo = 1               # pulsos entre la entrada de cada voz (0 = juntas · 24 = una voz por tiempo)
pulso = 0                 # 0 = acordes sostenidos · 1 a 8 = golpes euclidianos en corcheas por compás
suenan = true             # false: los pads callan pero siguen guiando la armonía
suspensiones = 0.3        # al cambiar de acorde, una voz se queda colgada y resuelve un tiempo después (ligado)
genero = "goa"            # género de los pads (independiente de los otros motores)
velocidad = 80
seed = "P-1C88"
disparo = 1               # canal de su nota larga (pista Synth 1): mutearla apaga solo los pads

[bajo]
# Generador de líneas de bajo: sigue la armonía de los pads (raíz, quinta, octava,
# notas de paso) y antes de cada cambio de acorde lleva a la raíz que viene.
activo = false
salida = "CH345"
canal = 4                 # 4 = FM-1
disparo = 0               # canal de su nota larga; 0 = el general
genero = "goa"            # goa, psy_chill, chillgressive, chillout, ambient (pone estilo y carácter)
estilo = "rolling"        # psy: rolling (K B B B), fullon (rolling melódico), tresillo (K + 2 en tresillo),
                          # galope (K · B B), saltado (K B · B), offbeat (K · B ·), chillgressive · dub · sub
armonia = "general"       # general (la de Música), guiada o libre
movimiento = 0.3          # 0 = solo la raíz · 1 = salta a la octava, la quinta y notas de paso
evolucion = 0.0           # 0 = fijo · 1 = cada "mutar_cada" compases cambia un golpe (se acumula)
mutar_cada = 4
transponer = 0            # grados de escala (4 = arranca en la quinta)
densidad = 1.0            # menos de 1 quita golpes (siempre los mismos)
swing = 0.0               # atrasa las semicorcheas débiles (hasta 0.5)
slide = 0.0               # notas que se pisan con la siguiente (sinte en legato con glide)
acentos = 0.2
fantasmas = 0.0           # golpes suaves en los huecos, nunca en el bombo
remates = true            # el último compás de cada frase cierra con un remate (alterna entre dos)
frase = 4                 # compases por frase
octava = 0
gate = 0.6                # largo de las notas cortas
velocidad = 100
vel_random = 0.1
seed = "B-0001"

[dialogo]
# Llamada y respuesta euclidiana: dos voces que reparten sus golpes parejo en el compás.
activo = false
modo = "motor"            # "motor": llama el motor · "en_vivo": llamas tú y responde el compás siguiente en tus huecos
forma = "entrelazado"     # entrelazado: la respuesta toca en los huecos de la llamada · turnos: alternan por compases
rejilla = "corcheas"      # corcheas: siempre con el bombo · semicorcheas: más rápido y sincopado
espacio = 1               # lugares de la rejilla que la respuesta espera después de cada nota de la llamada (0 a 3)
compases_turno = 2        # en turnos: compases de cada voz
disparo = 0               # canal de su nota larga (modo motor); 0 = el general
escucha = 4               # en vivo: canal donde tocas tu llamada
seguir_pads = true        # si los pads suenan: su escala y la raíz de cada acorde
evolucion = 0.5           # mutación: probabilidad de cambiar una nota o girar el patrón
mutar_cada = 4            # compases
seed = "CR-0001"
genero = "goa"            # género de la llamada y respuesta
armonia = "general"       # general (la de Música), guiada o libre

# Cada voz: cuántos golpes reparte y su color. La respuesta puede ir al mismo sinte.
[llamada]
salida = "FM-1"
canal = 4
golpes = 3                # de 8 (corcheas) o de 16 (semicorcheas); la llamada siempre cae en el uno
octava = 1
oscuridad = 0.7           # 0 = luminoso (raíz, ♭3, 5, ♭7) · 0.7 = oscuro (♭2, ♭6) · 1 = ultra (medio tono contra la raíz)
gate = 0.5                # largo de las notas; nunca pisa a la siguiente
velocidad = 100
vel_random = 0.15
desplazamiento = -1.0     # -1 = usa el Pegado ↔ Desplazado general · 0 a 1 = propio de esta voz

[respuesta]
salida = "MicroFreak"
canal = 3
golpes = 2
octava = 1
oscuridad = 0.7
gate = 0.6
velocidad = 92
vel_random = 0.15
desplazamiento = -1.0

[[secuencia]]
nombre = "A"
activa = true
disparo = 2               # canal de su nota larga (pista Synth 2); 0 = el general
salida = "FM-1"           # parte del nombre del puerto (míralo con goa-ports); en modo dongle: "CH345"
canal = 4                 # FM-1 en canal 4 (pista MIDI 2 de la Circuit)
genero = "goa"            # género de esta secuencia: elige su estilo y carácter en la app
armonia = "general"       # general (la de Música), guiada o libre
estilo = "rolling"        # goa: rolling, galope, arpegio3, acido · psy_chill: psy_chill
                          # chillgressive: euclidiano · chillout: largas · ambient: ambient
posicion = "offbeat"      # onbeat, offbeat, todos, desplazado
relacion = "unisono"      # unisono, tercera, quinta, octava
octava = 0                # sube o baja octavas completas (-2 a 2)
largo = 16                # 16, 13, 11, 7...
gate = 0.55               # largo de cada nota (0.1 a 1.0)
pedal = 0.5               # cuánto vuelve a la raíz (0 a 1)
seed = "7A3F-0291"
mutacion = 0.0            # probabilidad de cambiar cada nota al mutar (0 a 1)
mutar_cada = 8            # cada cuántos compases muta
bloqueada = false         # true: la mutación no cambia el patrón
velocidad = 96
acento = 124
# Afinación (0 a 1; swing 0 a 0.5)
densidad = 1.0            # menos de 1 quita notas; subirla de a poco agrega notas sin cambiar las que hay
gate_random = 0.0         # varía el largo de cada nota
vel_random = 0.0          # varía la fuerza de cada nota
swing = 0.0               # atrasa las semicorcheas pares
slide = 0.0               # slides: en acido es la cantidad total; en otros estilos se suman
acentos = 0.0             # acentos: en acido es la cantidad total; en otros estilos se suman
saltos = 0.0              # saltos de octava
repeticion = 0.0          # redobles de fusa en algunos pasos
largas = 0.0              # notas que se sostienen sobre los silencios siguientes

[[secuencia]]
nombre = "B"
activa = false            # ponla en true para probar dos secuencias
disparo = 0               # 0 = usa el canal general
salida = "MicroFreak"
canal = 3                 # MicroFreak en canal 3 (pista MIDI 1 de la Circuit)
estilo = "arpegio3"
posicion = "onbeat"
relacion = "quinta"
octava = 1
largo = 13
gate = 0.4
pedal = 0.3
seed = "B-5512"
mutacion = 0.1
mutar_cada = 8
bloqueada = false
velocidad = 90
acento = 110
